<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ERP KPP - Scanner Warehouse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #031b2b;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      color: #00bfff;
      font-size: 42px;
      margin: 10px 0;
      font-weight: 900;
    }

    .header p {
      font-size: 20px;
      color: #d5eaf5;
      margin: 0;
    }

    .panel {
      border: 2px solid #009bd0;
      border-radius: 22px;
      padding: 24px;
      background: #082c40;
      box-shadow: 0 0 15px rgba(0, 180, 255, 0.15);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: bold;
      color: #d8efff;
    }

    input,
    select {
      width: 100%;
      height: 58px;
      border: 2px solid #009bd0;
      border-radius: 13px;
      background: #031b2b;
      color: white;
      font-size: 19px;
      padding: 0 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #00eaff;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 13px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-scan {
      background: #00bd70;
    }

    .btn-focus {
      background: #08a9e0;
    }

    .btn-close {
      background: #d9363e;
    }

    .btn-send {
      background: #1478ff;
    }

    .history {
      margin-top: 25px;
      border: 2px solid #009bd0;
      border-radius: 22px;
      padding: 22px;
      background: #082c40;
    }

    .history h2 {
      color: #00bfff;
      margin-top: 0;
      font-size: 24px;
    }

    .history-item {
      border-bottom: 1px solid #27718d;
      padding: 12px 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .message {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #075d3b;
      border: 1px solid #00d982;
    }

    .error {
      display: block;
      background: #651d25;
      border: 1px solid #ff6875;
    }

    .scanner-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      padding: 15px;
    }

    .scanner-box {
      width: 100%;
      max-width: 550px;
      margin: auto;
      background: #082c40;
      border: 2px solid #00bfff;
      border-radius: 20px;
      padding: 18px;
    }

    .scanner-box h2 {
      text-align: center;
      color: #00d9ff;
      margin-top: 0;
    }

    #video {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: cover;
      background: black;
      border-radius: 14px;
      border: 2px solid #00bfff;
    }

    .scan-guide {
      text-align: center;
      color: #d8efff;
      margin: 12px 0;
      font-size: 15px;
    }

    .manual-area {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #27718d;
    }

    .manual-area input {
      height: 48px;
      font-size: 16px;
    }

    .manual-area button {
      min-height: 48px;
      font-size: 16px;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 36px;
      }

      .header p {
        font-size: 17px;
      }

      .panel {
        padding: 18px;
      }

      label {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>ERP KPP</h1>
      <p>SCANNER WAREHOUSE BARU</p>
    </div>

    <div class="panel">

      <label for="kategori">Kategori Barang</label>
      <select id="kategori">
        <option value="MATERIAL">MATERIAL</option>
        <option value="ALAT">ALAT</option>
        <option value="FILM">FILM</option>
      </select>

      <label for="admin">Nama Admin</label>
      <input
        type="text"
        id="admin"
        placeholder="Masukkan nama admin"
        autocomplete="off"
      >

      <label for="jumlah">Jumlah</label>
      <input
        type="number"
        id="jumlah"
        value="1"
        min="1"
        inputmode="numeric"
      >

      <label for="hasilBarcode">Hasil Barcode</label>
      <input
        type="text"
        id="hasilBarcode"
        placeholder="Belum ada barcode"
        readonly
      >

      <button
        type="button"
        class="btn-scan"
        id="btnScan"
      >
        SCAN BARCODE
      </button>

      <button
        type="button"
        class="btn-focus"
        id="btnFocus"
      >
        FOKUS SCANNER
      </button>

      <div id="message" class="message"></div>

    </div>

    <div class="history">
      <h2>RIWAYAT SCAN SEMENTARA</h2>
      <div id="historyList">
        Belum ada scan.
      </div>
    </div>

  </div>

  <!-- MODAL KAMERA -->
  <div class="scanner-modal" id="scannerModal">

    <div class="scanner-box">

      <h2>SCAN BARCODE</h2>

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="scan-guide">
        Arahkan kamera ke barcode sampai terbaca.
      </div>

      <button
        type="button"
        class="btn-close"
        id="btnCloseCamera"
      >
        TUTUP KAMERA
      </button>

      <div class="manual-area">
        <input
          type="text"
          id="manualBarcode"
          placeholder="Ketik barcode jika kamera gagal"
        >

        <button
          type="button"
          class="btn-send"
          id="btnManualSend"
        >
          KIRIM BARCODE MANUAL
        </button>
      </div>

    </div>

  </div>

  <script>
    /*
      GANTI URL INI DENGAN URL WEB APP APPS SCRIPT WAREHOUSE ANDA
    */
    const URL_WEB_APP =
      "https://script.google.com/macros/s/AKfycbw71VQ3s7kZKbPrSrYHLUvyalQCZU_QRx7RaCcd3JGgPml1hao55aILXeq-lFuCk06L/exec";

    let stream = null;
    let scanTimer = null;
    let sedangScan = false;

    const video = document.getElementById("video");
    const scannerModal = document.getElementById("scannerModal");
    const btnScan = document.getElementById("btnScan");
    const btnFocus = document.getElementById("btnFocus");
    const btnCloseCamera = document.getElementById("btnCloseCamera");
    const btnManualSend = document.getElementById("btnManualSend");

    const kategori = document.getElementById("kategori");
    const admin = document.getElementById("admin");
    const jumlah = document.getElementById("jumlah");
    const hasilBarcode = document.getElementById("hasilBarcode");
    const manualBarcode = document.getElementById("manualBarcode");
    const message = document.getElementById("message");
    const historyList = document.getElementById("historyList");

    let riwayat = [];

    function tampilPesan(teks, tipe) {
      message.textContent = teks;
      message.className = "message " + tipe;
    }

    function hapusPesan() {
      message.textContent = "";
      message.className = "message";
    }

    function cekURLWebApp() {
      if (
        !URL_WEB_APP ||
        URL_WEB_APP.includes("TEMPELKAN_URL") ||
        !URL_WEB_APP.startsWith("https://script.google.com/macros/s/")
      ) {
        tampilPesan(
          "URL Web App Apps Script belum dimasukkan pada kode index.html.",
          "error"
        );
        return false;
      }

      return true;
    }

async function kirimKeWebApp(kodeBarcode) {
  if (!cekURLWebApp()) {
    return;
  }

  const namaAdmin = admin.value.trim();
  const jenis = kategori.value;
  const qty = jumlah.value;

  if (!namaAdmin) {
    tampilPesan("Nama admin wajib diisi.", "error");
    admin.focus();
    return;
  }

  if (!qty || Number(qty) < 1) {
    tampilPesan("Jumlah harus lebih besar dari 0.", "error");
    jumlah.focus();
    return;
  }

  const url =
    URL_WEB_APP +
    "?barcode=" + encodeURIComponent(kodeBarcode) +
    "&jenis=" + encodeURIComponent(jenis) +
    "&admin=" + encodeURIComponent(namaAdmin) +
    "&jumlah=" + encodeURIComponent(qty);

  tampilPesan("Mengirim data ke Google Sheets...", "success");

  try {
    const response = await fetch(url, {
      method: "GET",
      mode: "cors",
      redirect: "follow",
      cache: "no-store"
    });

    const hasil = await response.text();

    if (hasil.includes("OK") || hasil.includes("SUKSES")) {
      tampilPesan(hasil, "success");
      tambahRiwayat(kodeBarcode, jenis, namaAdmin, qty, hasil);
    } else {
      tampilPesan(hasil, "error");
    }

  } catch (error) {
    console.error(error);

    tampilPesan(
      "Web App tidak dapat dihubungi.\n" +
      "Cek kembali URL /exec dan akses deployment Apps Script.",
      "error"
    );
  }
}

      try {
        scannerModal.style.display = "block";

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            },
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },
          audio: false
        });

        video.srcObject = stream;
        sedangScan = true;

        mulaiDeteksiBarcode();

      } catch (error) {
        scannerModal.style.display = "none";

        tampilPesan(
          "Kamera tidak bisa dibuka.\n\n" +
          "Pastikan izin kamera diberikan kepada Chrome.\n" +
          "Detail: " + error.message,
          "error"
        );
      }
    }

    function tutupKamera() {
      sedangScan = false;

      if (scanTimer) {
        clearTimeout(scanTimer);
        scanTimer = null;
      }

      if (stream) {
        stream.getTracks().forEach(function(track) {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;
      scannerModal.style.display = "none";
    }

    function mulaiDeteksiBarcode() {
      if (!sedangScan) {
        return;
      }

      if (!("BarcodeDetector" in window)) {
        tampilPesan(
          "Browser belum mendukung pembacaan barcode otomatis.\n" +
          "Silakan ketik barcode pada kolom manual di jendela kamera.",
          "error"
        );
        return;
      }

      const detector = new BarcodeDetector({
        formats: [
          "code_128",
          "code_39",
          "ean_13",
          "ean_8",
          "upc_a",
          "upc_e",
          "qr_code"
        ]
      });

      deteksiDenganKamera(detector);
    }

    async function deteksiDenganKamera(detector) {
      if (!sedangScan) {
        return;
      }

      try {
        if (video.readyState >= 2) {
          const hasil = await detector.detect(video);

          if (hasil && hasil.length > 0) {
            const nilaiBarcode = hasil[0].rawValue;

            if (nilaiBarcode) {
              sedangScan = false;
              tutupKamera();
              prosesBarcode(nilaiBarcode);
              return;
            }
          }
        }
      } catch (error) {
        console.log("Deteksi barcode:", error);
      }

      scanTimer = setTimeout(function() {
        deteksiDenganKamera(detector);
      }, 250);
    }

    function prosesBarcode(nilaiBarcode) {
      const kode = String(nilaiBarcode || "").trim();

      if (!kode) {
        tampilPesan("Barcode kosong.", "error");
        return;
      }

      hasilBarcode.value = kode;
      manualBarcode.value = kode;

      kirimKeWebApp(kode);
    }

    async function kirimKeWebApp(kodeBarcode) {
      if (!cekURLWebApp()) {
        return;
      }

      const namaAdmin = admin.value.trim();
      const jenis = kategori.value;
      const qty = jumlah.value;

      if (!namaAdmin) {
        tampilPesan("Nama admin wajib diisi.", "error");
        admin.focus();
        return;
      }

      if (!qty || Number(qty) < 1) {
        tampilPesan("Jumlah harus lebih besar dari 0.", "error");
        jumlah.focus();
        return;
      }

      tampilPesan("Mengirim data scan ke Google Sheets...", "success");

      const url =
        URL_WEB_APP +
        "?barcode=" + encodeURIComponent(kodeBarcode) +
        "&jenis=" + encodeURIComponent(jenis) +
        "&admin=" + encodeURIComponent(namaAdmin) +
        "&jumlah=" + encodeURIComponent(qty);

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store"
        });

        const hasil = await response.text();

        if (
          hasil.startsWith("OK") ||
          hasil.startsWith("SUKSES") ||
          hasil.startsWith("BERHASIL")
        ) {
          tampilPesan(hasil, "success");
          tambahRiwayat(kodeBarcode, jenis, namaAdmin, qty, hasil);
        } else if (hasil.startsWith("DUPLIKAT")) {
          tampilPesan(hasil, "error");
          tambahRiwayat(kodeBarcode, jenis, namaAdmin, qty, hasil);
        } else {
          tampilPesan(hasil, "error");
        }

      } catch (error) {
        tampilPesan(
          "Gagal menghubungi Web App Apps Script.\n\n" +
          "Periksa URL Web App dan akses deployment.\n\n" +
          error.message,
          "error"
        );
      }
    }

    function tambahRiwayat(kode, jenis, namaAdmin, qty, hasil) {
      riwayat.unshift({
        waktu: new Date().toLocaleString("id-ID"),
        barcode: kode,
        jenis: jenis,
        admin: namaAdmin,
        jumlah: qty,
        hasil: hasil
      });

      if (riwayat.length > 20) {
        riwayat = riwayat.slice(0, 20);
      }

      tampilkanRiwayat();
    }

    function tampilkanRiwayat() {
      if (riwayat.length === 0) {
        historyList.textContent = "Belum ada scan.";
        return;
      }

      historyList.innerHTML = "";

      riwayat.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "history-item";

        div.innerHTML =
          "<b>Barcode:</b> " + aman(item.barcode) + "<br>" +
          "<b>Kategori:</b> " + aman(item.jenis) + "<br>" +
          "<b>Admin:</b> " + aman(item.admin) + "<br>" +
          "<b>Jumlah:</b> " + aman(item.jumlah) + "<br>" +
          "<b>Waktu:</b> " + aman(item.waktu) + "<br>" +
          "<b>Hasil:</b> " + aman(item.hasil);

        historyList.appendChild(div);
      });
    }

    function aman(teks) {
      return String(teks)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    btnScan.addEventListener("click", function() {
      bukaKamera();
    });

    btnFocus.addEventListener("click", function() {
      if (scannerModal.style.display === "block") {
        video.focus();
      } else {
        bukaKamera();
      }
    });

    btnCloseCamera.addEventListener("click", function() {
      tutupKamera();
    });

    btnManualSend.addEventListener("click", function() {
      const kode = manualBarcode.value.trim();

      if (!kode) {
        alert("Masukkan barcode terlebih dahulu.");
        manualBarcode.focus();
        return;
      }

      tutupKamera();
      prosesBarcode(kode);
    });

    manualBarcode.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        btnManualSend.click();
      }
    });

    window.addEventListener("beforeunload", function() {
      tutupKamera();
    });
  </script>

</body>
</html>
