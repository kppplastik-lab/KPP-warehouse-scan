<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ERP KPP - Scanner Warehouse</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #031522, #062f43);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #00bfff;
      font-size: 38px;
      font-weight: 800;
    }

    .header p {
      margin-top: 8px;
      font-size: 19px;
      color: #d8f5ff;
    }

    .card {
      padding: 25px;
      border: 2px solid #009ed0;
      border-radius: 25px;
      background: rgba(5, 42, 59, 0.95);
      box-shadow: 0 0 15px rgba(0, 174, 255, 0.15);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: bold;
      color: #d8f5ff;
    }

    input,
    select {
      width: 100%;
      height: 58px;
      padding: 0 16px;
      color: white;
      background: #031c2b;
      border: 2px solid #009ed0;
      border-radius: 15px;
      font-size: 19px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #00e1ff;
      box-shadow: 0 0 8px rgba(0, 225, 255, 0.4);
    }

    button {
      width: 100%;
      min-height: 58px;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-scan {
      background: #00c878;
    }

    .btn-focus {
      background: #08a9df;
    }

    .btn-close {
      background: #d9363e;
    }

    .btn-kirim {
      background: #ff9800;
    }

    #reader {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      overflow: hidden;
      border: 2px solid #00bfff;
      border-radius: 15px;
      background: #00131f;
    }

    .hasil {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #063e52;
      border: 1px solid #00bfff;
      color: #ffffff;
      font-size: 17px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .pesan {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .sukses {
      display: block;
      background: #075b3c;
      border: 1px solid #00e18a;
    }

    .error {
      display: block;
      background: #691d26;
      border: 1px solid #ff5964;
    }

    .riwayat-card {
      margin-top: 25px;
      padding: 25px;
      border: 2px solid #009ed0;
      border-radius: 25px;
      background: rgba(5, 42, 59, 0.95);
    }

    .riwayat-card h2 {
      margin-top: 0;
      color: #00bfff;
      font-size: 25px;
    }

    .riwayat-item {
      margin-top: 10px;
      padding: 12px;
      border-left: 4px solid #00c878;
      border-radius: 8px;
      background: #062c3c;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .keterangan {
      margin-top: 12px;
      color: #a9d9e8;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>ERP KPP</h1>
      <p>SCANNER WAREHOUSE BARU</p>
    </div>

    <div class="card">

      <label for="kategori">Kategori Barang</label>
      <select id="kategori">
        <option value="MATERIAL">MATERIAL</option>
        <option value="ALAT">ALAT</option>
        <option value="FILM">FILM</option>
      </select>

      <label for="admin">Nama Admin</label>
      <input
        type="text"
        id="admin"
        placeholder="Masukkan nama admin"
        autocomplete="off"
      >

      <label for="jumlah">Jumlah</label>
      <input
        type="number"
        id="jumlah"
        value="1"
        min="1"
        step="1"
      >

      <label for="barcode">Hasil Barcode</label>
      <input
        type="text"
        id="barcode"
        placeholder="Tekan tombol Scan Barcode"
        autocomplete="off"
      >

      <button class="btn-scan" onclick="bukaKamera()">
        SCAN BARCODE
      </button>

      <button class="btn-focus" onclick="fokusBarcode()">
        FOKUS SCANNER
      </button>

      <div id="reader"></div>

      <button
        id="tombolTutup"
        class="btn-close"
        onclick="tutupKamera()"
        style="display:none;"
      >
        TUTUP KAMERA
      </button>

      <button class="btn-kirim" onclick="kirimBarcode()">
        KIRIM DATA
      </button>

      <div id="hasil" class="hasil"></div>
      <div id="pesan" class="pesan"></div>

      <div class="keterangan">
        Izinkan akses kamera ketika diminta oleh browser.
      </div>

    </div>

    <div class="riwayat-card">
      <h2>RIWAYAT SCAN</h2>
      <div id="riwayat">
        Belum ada scan.
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycby0-lDl1Hf8qBPXvFf0AOVOQkMYsLCNDy_PTn9kpriQPc6oDhBBfc4uj2WyGAdDWI3Y/exec";

    let scanner = null;
    let kameraAktif = false;

    const barcodeInput = document.getElementById("barcode");
    const kategoriInput = document.getElementById("kategori");
    const adminInput = document.getElementById("admin");
    const jumlahInput = document.getElementById("jumlah");
    const reader = document.getElementById("reader");
    const tombolTutup = document.getElementById("tombolTutup");
    const hasil = document.getElementById("hasil");
    const pesan = document.getElementById("pesan");
    const riwayat = document.getElementById("riwayat");

    function tampilPesan(teks, tipe) {
      pesan.textContent = teks;
      pesan.className = "pesan " + tipe;
    }

    function bersihkanPesan() {
      pesan.textContent = "";
      pesan.className = "pesan";
    }

    function tampilHasil(teks) {
      hasil.style.display = "block";
      hasil.textContent = teks;
    }

    function fokusBarcode() {
      barcodeInput.focus();
      barcodeInput.select();
    }

    async function bukaKamera() {
      bersihkanPesan();

      if (kameraAktif) {
        return;
      }

      if (!window.isSecureContext) {
        tampilPesan(
          "Kamera hanya bisa digunakan melalui HTTPS. Buka website GitHub Pages dengan alamat https://.",
          "error"
        );
        return;
      }

      reader.style.display = "block";
      tombolTutup.style.display = "block";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 150
            },
            aspectRatio: 1.777778
          },
          function hasilScan(decodedText) {
            barcodeInput.value = decodedText;
            tampilHasil("Barcode terbaca: " + decodedText);

            tutupKamera();
            kirimBarcode();
          },
          function errorScan(errorMessage) {
            // Tidak perlu menampilkan error scan setiap frame.
          }
        );

        kameraAktif = true;
      } catch (error) {
        reader.style.display = "none";
        tombolTutup.style.display = "none";

        tampilPesan(
          "Kamera tidak dapat dibuka.\n\n" +
          "Pastikan:\n" +
          "1. Izin kamera sudah diizinkan.\n" +
          "2. Website dibuka melalui HTTPS.\n" +
          "3. Kamera tidak sedang digunakan aplikasi lain.\n\n" +
          "Detail: " + error,
          "error"
        );
      }
    }

    async function tutupKamera() {
      if (scanner && kameraAktif) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.log("Kamera sudah berhenti:", error);
        }
      }

      scanner = null;
      kameraAktif = false;
      reader.style.display = "none";
      tombolTutup.style.display = "none";
    }

    async function kirimBarcode() {
      bersihkanPesan();

      const kategori = kategoriInput.value.trim();
      const admin = adminInput.value.trim();
      const jumlah = jumlahInput.value.trim();
      const barcode = barcodeInput.value.trim();

      if (!admin) {
        tampilPesan("Nama admin wajib diisi.", "error");
        adminInput.focus();
        return;
      }

      if (!barcode) {
        tampilPesan("Barcode belum terbaca atau belum dimasukkan.", "error");
        barcodeInput.focus();
        return;
      }

      if (!jumlah || Number(jumlah) < 1) {
        tampilPesan("Jumlah harus minimal 1.", "error");
        jumlahInput.focus();
        return;
      }

      tampilPesan("Sedang mengirim data ke Google Sheets...", "sukses");

      const url =
        WEB_APP_URL +
        "?barcode=" + encodeURIComponent(barcode) +
        "&jenis=" + encodeURIComponent(kategori) +
        "&admin=" + encodeURIComponent(admin) +
        "&jumlah=" + encodeURIComponent(jumlah);

      try {
        const response = await fetch(url, {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        if (
          text.toUpperCase().includes("OK") ||
          text.toUpperCase().includes("BERHASIL")
        ) {
          tampilPesan("Data berhasil dikirim:\n" + text, "sukses");
          tambahRiwayat(kategori, admin, jumlah, barcode, text);
          barcodeInput.value = "";
        } else if (text.toUpperCase().includes("DUPLIKAT")) {
          tampilPesan("Barcode sudah pernah discan:\n" + text, "error");
        } else {
          tampilPesan("Balasan dari server:\n" + text, "error");
        }

      } catch (error) {
        tampilPesan(
          "Gagal menghubungi Web App Apps Script.\n\n" +
          "Periksa:\n" +
          "1. URL Web App sudah benar.\n" +
          "2. Deployment Apps Script sudah diatur: Anyone.\n" +
          "3. Web App sudah versi terbaru.\n" +
          "4. Internet aktif.\n\n" +
          "Detail: " + error.message,
          "error"
        );
      }
    }

    function tambahRiwayat(kategori, admin, jumlah, barcode, hasilServer) {
      if (riwayat.textContent.trim() === "Belum ada scan.") {
        riwayat.innerHTML = "";
      }

      const waktu = new Date().toLocaleString("id-ID");

      const item = document.createElement("div");
      item.className = "riwayat-item";

      item.innerHTML =
        "<b>Waktu:</b> " + waktu + "<br>" +
        "<b>Kategori:</b> " + escapeHtml(kategori) + "<br>" +
        "<b>Admin:</b> " + escapeHtml(admin) + "<br>" +
        "<b>Jumlah:</b> " + escapeHtml(jumlah) + "<br>" +
        "<b>Barcode:</b> " + escapeHtml(barcode) + "<br>" +
        "<b>Status:</b> " + escapeHtml(hasilServer);

      riwayat.prepend(item);
    }

    function escapeHtml(teks) {
      return String(teks)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    barcodeInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        kirimBarcode();
      }
    });

    window.addEventListener("beforeunload", function() {
      tutupKamera();
    });
  </script>

</body>
</html>
