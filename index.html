<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scan Warehouse</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #031d2b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #00aeef;
      margin-bottom: 25px;
    }

    .box {
      border: 3px solid #00a9e0;
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 25px;
      background: #073346;
    }

    label {
      display: block;
      font-size: 23px;
      font-weight: bold;
      margin: 18px 0 10px;
    }

    input,
    select {
      width: 100%;
      padding: 18px;
      border-radius: 20px;
      border: 3px solid #00a9e0;
      background: #031d2b;
      color: white;
      font-size: 22px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #00ffae;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 18px;
      border: none;
      border-radius: 20px;
      font-size: 23px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .btn-scan {
      background: #00c875;
    }

    .btn-camera {
      background: #08a9df;
    }

    .btn-stop {
      background: #e53935;
    }

    .status {
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #075d3e;
      border: 2px solid #00d084;
      font-size: 19px;
      white-space: pre-line;
    }

    .status.error {
      background: #641d27;
      border-color: #ff6675;
    }

    .status.warning {
      background: #614b08;
      border-color: #ffd43b;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      display: none;
      border-radius: 15px;
      overflow: hidden;
      background: white;
    }

    .history-title {
      color: #00aeef;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .history-item {
      background: #031d2b;
      border: 1px solid #087da5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      font-size: 17px;
      line-height: 1.6;
    }

    .empty {
      font-size: 19px;
      color: #dddddd;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .box {
        padding: 18px;
        border-radius: 24px;
      }

      label {
        font-size: 21px;
      }

      input,
      select {
        font-size: 20px;
      }

      button {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SCAN WAREHOUSE</h1>

    <div class="box">

      <label for="jenis">Jenis Barang</label>
      <select id="jenis">
        <option value="MATERIAL">MATERIAL</option>
        <option value="ALAT">ALAT</option>
        <option value="FILM">FILM</option>
      </select>

      <label for="admin">Nama Admin</label>
      <input
        type="text"
        id="admin"
        value="Adm"
        placeholder="Masukkan nama admin"
      >

      <label for="jumlah">Jumlah</label>
      <input
        type="number"
        id="jumlah"
        value="1"
        min="1"
      >

      <label for="barcode">Barcode</label>
      <input
        type="text"
        id="barcode"
        placeholder="Scan atau ketik barcode"
        autocomplete="off"
      >

      <button
        type="button"
        class="btn-scan"
        id="btnKirim"
        onclick="kirimScan()"
      >
        SCAN BARCODE
      </button>

      <button
        type="button"
        class="btn-camera"
        onclick="bukaScanner()"
      >
        FOKUS SCANNER
      </button>

      <button
        type="button"
        class="btn-stop"
        id="btnStop"
        onclick="tutupScanner()"
        style="display:none;"
      >
        TUTUP SCANNER
      </button>

      <div id="reader"></div>

      <div id="status" class="status">
        Siap melakukan scan barcode.
      </div>

    </div>

    <div class="box">
      <div class="history-title">
        RIWAYAT SCAN SEMENTARA
      </div>

      <div id="history">
        <div class="empty">Belum ada scan.</div>
      </div>
    </div>

  </div>

  <script>
    /*
      GANTI DENGAN URL WEB APP APPS SCRIPT TERBARU
      URL HARUS BERAKHIR /exec
    */
    const URL_WEB_APP =
      "https://script.google.com/macros/s/AKfycbzmwz3pb7EaqlM4ZJQscDYHJLd0f6PDlJ6vNrPKBYl_bfWSO6WqAFDFQeMHJJnQGYd6/exec";

    let scanner = null;
    let sedangScan = false;
    let riwayat = [];

    function tampilkanStatus(pesan, tipe = "") {
      const status = document.getElementById("status");

      status.textContent = pesan;
      status.className = "status";

      if (tipe) {
        status.classList.add(tipe);
      }
    }

    function kirimScan() {
      const barcode = document
        .getElementById("barcode")
        .value
        .trim();

      const admin = document
        .getElementById("admin")
        .value
        .trim() || "ADMIN";

      const jenis = document
        .getElementById("jenis")
        .value;

      const jumlah = Math.max(
        1,
        Number(document.getElementById("jumlah").value || 1)
      );

      if (!barcode) {
        tampilkanStatus("Barcode belum diisi.", "warning");
        document.getElementById("barcode").focus();
        return;
      }

      if (
        !URL_WEB_APP ||
        URL_WEB_APP.includes("https://script.google.com/macros/s/AKfycbzmwz3pb7EaqlM4ZJQscDYHJLd0f6PDlJ6vNrPKBYl_bfWSO6WqAFDFQeMHJJnQGYd6/exec")
      ) {
        tampilkanStatus(
          "URL Web App belum dimasukkan ke index.html.",
          "error"
        );
        return;
      }

      tampilkanStatus(
        "Mengirim data scan ke Google Sheets..."
      );

      document.getElementById("btnKirim").disabled = true;

      const url =
        URL_WEB_APP +
        "?barcode=" + encodeURIComponent(barcode) +
        "&admin=" + encodeURIComponent(admin) +
        "&jenis=" + encodeURIComponent(jenis) +
        "&jumlah=" + encodeURIComponent(jumlah) +
        "&callback=hasilScanGoogle";

      const scriptLama =
        document.getElementById("jsonpScan");

      if (scriptLama) {
        scriptLama.remove();
      }

      const script = document.createElement("script");

      script.id = "jsonpScan";
      script.src = url;

      script.onerror = function () {
        document.getElementById("btnKirim").disabled = false;

        tampilkanStatus(
          "Gagal menghubungi Google Apps Script.\n" +
          "Periksa URL Web App dan deployment.",
          "error"
        );
      };

      document.body.appendChild(script);
    }

    function hasilScanGoogle(data) {
      document.getElementById("btnKirim").disabled = false;

      if (!data) {
        tampilkanStatus(
          "Respons Google Apps Script kosong.",
          "error"
        );
        return;
      }

      if (data.status === "OK") {
        tampilkanStatus(
          data.message +
          "\nBarang: " + (data.namaBarang || "-") +
          "\nKategori: " + (data.kategori || "-") +
          "\nStok sebelum: " + (data.stokSebelum ?? "-") +
          "\nStok sesudah: " + (data.stokSesudah ?? "-"),
          ""
        );

        tambahRiwayat(data);

        document.getElementById("barcode").value = "";
        document.getElementById("barcode").focus();

      } else {
        tampilkanStatus(
          data.message || "Scan gagal.",
          "error"
        );
      }
    }

    function tambahRiwayat(data) {
      riwayat.unshift({
        waktu: data.waktu || new Date().toLocaleString("id-ID"),
        barcode: data.barcode || "-",
        namaBarang: data.namaBarang || "-",
        kategori: data.kategori || "-",
        admin: data.admin || "-",
        jumlah: data.jumlah || 1
      });

      if (riwayat.length > 20) {
        riwayat = riwayat.slice(0, 20);
      }

      tampilkanRiwayat();
    }

    function tampilkanRiwayat() {
      const history = document.getElementById("history");

      if (riwayat.length === 0) {
        history.innerHTML =
          '<div class="empty">Belum ada scan.</div>';
        return;
      }

      history.innerHTML = riwayat.map(function (item) {
        return `
          <div class="history-item">
            <b>Waktu:</b> ${aman(item.waktu)}<br>
            <b>Barcode:</b> ${aman(item.barcode)}<br>
            <b>Barang:</b> ${aman(item.namaBarang)}<br>
            <b>Kategori:</b> ${aman(item.kategori)}<br>
            <b>Admin:</b> ${aman(item.admin)}<br>
            <b>Jumlah:</b> ${aman(item.jumlah)}
          </div>
        `;
      }).join("");
    }

    function aman(nilai) {
      return String(nilai)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function bukaScanner() {
      const reader = document.getElementById("reader");
      const btnStop = document.getElementById("btnStop");

      if (sedangScan) {
        return;
      }

      reader.style.display = "block";
      btnStop.style.display = "block";

      scanner = new Html5Qrcode("reader");
      sedangScan = true;

      scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 150
          }
        },
        function (hasilBarcode) {
          document.getElementById("barcode").value =
            hasilBarcode;

          tutupScanner();

          tampilkanStatus(
            "Barcode terbaca: " + hasilBarcode
          );
        },
        function () {
          // Abaikan error pembacaan kamera sementara
        }
      ).catch(function (error) {
        sedangScan = false;
        reader.style.display = "none";
        btnStop.style.display = "none";

        tampilkanStatus(
          "Kamera tidak dapat dibuka.\n" + error,
          "error"
        );
      });
    }

    function tutupScanner() {
      const reader = document.getElementById("reader");
      const btnStop = document.getElementById("btnStop");

      if (scanner && sedangScan) {
        scanner.stop()
          .then(function () {
            scanner.clear();
          })
          .catch(function () {
            // Abaikan error saat menutup kamera
          });
      }

      scanner = null;
      sedangScan = false;

      reader.style.display = "none";
      btnStop.style.display = "none";
    }

    document
      .getElementById("barcode")
      .addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          kirimScan();
        }
      });
  </script>

</body>
</html>
