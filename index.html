<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ERP KPP - Scanner Warehouse</title>

 <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #061b2b;
      color: white;
    }

    .header {
      text-align: center;
      padding: 35px 15px 25px;
    }

    .header h1 {
      margin: 0;
      color: #00bfff;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header p {
      margin-top: 12px;
      color: #d8edf7;
      font-size: 20px;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: auto;
    }

    .panel {
      border: 1px solid #008fc4;
      border-radius: 20px;
      padding: 25px;
      background: #09283b;
      box-shadow: 0 0 15px rgba(0, 174, 239, 0.08);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #cdeeff;
    }

    input,
    select {
      width: 100%;
      padding: 17px;
      border-radius: 12px;
      border: 2px solid #008fc4;
      background: #061b2b;
      color: white;
      font-size: 18px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #00d9ff;
    }

    input::placeholder {
      color: #8295a1;
    }

    .button {
      width: 100%;
      padding: 17px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .button-scan {
      background: #00bf72;
    }

    .button-focus {
      background: #08a9e0;
    }

    .button-stop {
      background: #e53935;
    }

    .button:active {
      transform: scale(0.98);
    }

    #cameraBox {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #00aeea;
      border-radius: 15px;
      background: #061b2b;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.5;
      background: #12394d;
      border: 1px solid #008fc4;
    }

    .status.success {
      display: block;
      background: #064b35;
      border-color: #00d084;
    }

    .status.error {
      display: block;
      background: #5a1b1b;
      border-color: #ff5252;
    }

    .status.info {
      display: block;
      background: #12394d;
      border-color: #00aeea;
    }

    .history-panel {
      margin-top: 25px;
      margin-bottom: 30px;
    }

    .history-panel h2 {
      margin-top: 0;
      color: #00c5ff;
      font-size: 25px;
    }

    .empty {
      color: #c5d5df;
      font-size: 17px;
    }

    .history-item {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 10px;
      background: #061b2b;
      border-left: 4px solid #00c5ff;
    }

    .history-item strong {
      color: #00d084;
    }

    .history-item small {
      display: block;
      margin-top: 5px;
      color: #b5cbd6;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #8295a1;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 32px;
      }

      .header p {
        font-size: 18px;
      }

      .panel {
        padding: 18px;
      }

      label {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>ERP KPP</h1>
    <p>SCANNER WAREHOUSE BARU</p>
  </header>

  <main class="container">

    <section class="panel">

      <div class="form-group">
        <label for="kategori">Kategori Barang</label>

        <select id="kategori">
          <option value="MATERIAL">MATERIAL</option>
          <option value="ALAT">ALAT</option>
          <option value="FILM">FILM</option>
        </select>
      </div>

      <div class="form-group">
        <label for="admin">Nama Admin</label>

        <input
          type="text"
          id="admin"
          placeholder="Masukkan nama admin"
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah</label>

        <input
          type="number"
          id="jumlah"
          value="1"
          min="1"
          step="1"
        >
      </div>

      <button
        type="button"
        class="button button-scan"
        id="scanButton"
      >
        SCAN BARCODE
      </button>

      <button
        type="button"
        class="button button-focus"
        id="focusButton"
      >
        FOKUS SCANNER
      </button>

      <div id="cameraBox">

        <div id="reader"></div>

        <button
          type="button"
          class="button button-stop"
          id="stopCamera"
        >
          TUTUP KAMERA
        </button>

      </div>

      <div id="statusBox" class="status"></div>

    </section>

    <section class="panel history-panel">

      <h2>RIWAYAT SCAN SEMENTARA</h2>

      <div id="historyList">
        <div class="empty">Belum ada scan.</div>
      </div>

    </section>

  </main>

  <footer class="footer">
    ERP KPP Warehouse System
  </footer>

  <script>
    /*
      GANTI URL INI DENGAN URL WEB APP APPS SCRIPT WAREHOUSE BARU
    */
    const API_URL = "ISI_URL_WEB_APP_APPS_SCRIPT_DI_SINI";

    let scannerWarehouse = null;
    let scannerAktif = false;
    let riwayatScan = [];

    const kategoriInput = document.getElementById("kategori");
    const adminInput = document.getElementById("admin");
    const jumlahInput = document.getElementById("jumlah");

    const scanButton = document.getElementById("scanButton");
    const focusButton = document.getElementById("focusButton");
    const stopCameraButton = document.getElementById("stopCamera");

    const cameraBox = document.getElementById("cameraBox");
    const statusBox = document.getElementById("statusBox");
    const historyList = document.getElementById("historyList");

    function tampilStatus(pesan, tipe) {
      statusBox.textContent = pesan;
      statusBox.className = "status " + tipe;
    }

    function validasiForm() {
      const admin = adminInput.value.trim();
      const jumlah = Number(jumlahInput.value);

      if (admin === "") {
        tampilStatus("Nama admin wajib diisi.", "error");
        adminInput.focus();
        return false;
      }

      if (!jumlah || jumlah < 1) {
        tampilStatus("Jumlah harus lebih dari 0.", "error");
        jumlahInput.focus();
        return false;
      }

      if (!API_URL || API_URL.includes("ISI_URL")) {
        tampilStatus(
          "URL Web App Apps Script belum dimasukkan pada kode index.html.",
          "error"
        );
        return false;
      }

      return true;
    }

    async function mulaiKamera() {
      if (!validasiForm()) {
        return;
      }

      if (scannerAktif) {
        return;
      }

      cameraBox.style.display = "block";

      tampilStatus("Meminta izin kamera...", "info");

      scannerWarehouse = new Html5Qrcode("reader");

      try {
        await scannerWarehouse.start(
          {
            facingMode: {
              exact: "environment"
            }
          },
          {
            fps: 10,
            qrbox: {
              width: 260,
              height: 160
            },
            aspectRatio: 1.5
          },
          function(decodedText) {
            prosesBarcode(decodedText);
          },
          function(errorMessage) {
            // Error scan tidak ditampilkan agar tidak mengganggu layar.
          }
        );

        scannerAktif = true;

        tampilStatus(
          "Kamera aktif. Arahkan kamera ke barcode barang.",
          "info"
        );

      } catch (error) {
        console.error(error);

        cameraBox.style.display = "none";

        tampilStatus(
          "Kamera tidak bisa dibuka. Pastikan izin kamera sudah diizinkan pada browser.",
          "error"
        );
      }
    }

    async function hentikanKamera() {
      if (scannerWarehouse && scannerAktif) {
        try {
          await scannerWarehouse.stop();
          scannerWarehouse.clear();
        } catch (error) {
          console.error("Gagal menghentikan kamera:", error);
        }
      }

      scannerWarehouse = null;
      scannerAktif = false;
      cameraBox.style.display = "none";
    }

    async function prosesBarcode(kodeBarcode) {
      if (!kodeBarcode) {
        return;
      }

      await hentikanKamera();

      const kategori = kategoriInput.value;
      const admin = adminInput.value.trim();
      const jumlah = Number(jumlahInput.value);

      tampilStatus(
        "Barcode terbaca: " + kodeBarcode + ". Sedang menyimpan...",
        "info"
      );

      const data = {
        barcode: kodeBarcode,
        jenis: kategori,
        kategori: kategori,
        admin: admin,
        jumlah: jumlah
      };

      try {
        const parameter = new URLSearchParams(data);

        const response = await fetch(API_URL + "?" + parameter.toString(), {
          method: "GET",
          mode: "cors"
        });

        const hasil = await response.text();

        if (
          hasil.toUpperCase().includes("OK") ||
          hasil.toUpperCase().includes("BERHASIL") ||
          hasil.toUpperCase().includes("SUKSES")
        ) {
          tampilStatus(
            "Berhasil disimpan.\nBarcode: " +
            kodeBarcode +
            "\nKategori: " +
            kategori +
            "\nJumlah: " +
            jumlah,
            "success"
          );

          tambahRiwayat({
            barcode: kodeBarcode,
            kategori: kategori,
            jumlah: jumlah,
            admin: admin,
            waktu: new Date().toLocaleString("id-ID")
          });

        } else if (hasil.toUpperCase().includes("DUPLIKAT")) {
          tampilStatus(
            "Barcode sudah pernah discan:\n" + kodeBarcode,
            "error"
          );

        } else {
          tampilStatus(
            "Jawaban dari server:\n" + hasil,
            "error"
          );
        }

      } catch (error) {
        console.error(error);

        tampilStatus(
          "Gagal terhubung ke Google Apps Script. Periksa URL Web App dan aksesnya.",
          "error"
        );
      }
    }

    function tambahRiwayat(data) {
      riwayatScan.unshift(data);

      if (riwayatScan.length > 20) {
        riwayatScan.pop();
      }

      tampilkanRiwayat();
    }

    function tampilkanRiwayat() {
      historyList.innerHTML = "";

      if (riwayatScan.length === 0) {
        historyList.innerHTML =
          '<div class="empty">Belum ada scan.</div>';
        return;
      }

      riwayatScan.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "history-item";

        div.innerHTML = `
          <strong>${escapeHtml(item.barcode)}</strong>
          <div>Kategori: ${escapeHtml(item.kategori)}</div>
          <div>Jumlah: ${escapeHtml(String(item.jumlah))}</div>
          <small>Admin: ${escapeHtml(item.admin)}</small>
          <small>${escapeHtml(item.waktu)}</small>
        `;

        historyList.appendChild(div);
      });
    }

    function escapeHtml(teks) {
      return String(teks)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    scanButton.addEventListener("click", function() {
      mulaiKamera();
    });

    focusButton.addEventListener("click", function() {
      if (!scannerAktif) {
        mulaiKamera();
        return;
      }

      const reader = document.getElementById("reader");

      if (reader) {
        reader.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    });

    stopCameraButton.addEventListener("click", function() {
      hentikanKamera();

      tampilStatus(
        "Kamera ditutup.",
        "info"
      );
    });
  </script>

</body>
</html>
