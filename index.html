<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Warehouse</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #031d2b; color: white; font-family: Arial, sans-serif; }
    .container { width: 100%; max-width: 680px; margin: auto; }
    h1 { text-align: center; color: #00aeef; font-size: 32px; margin: 15px 0 25px; }
    .box { background: #073346; border: 3px solid #00a9e0; border-radius: 28px; padding: 25px; margin-bottom: 25px; }
    label { display: block; margin-top: 18px; margin-bottom: 10px; font-size: 23px; font-weight: bold; }
    input, select { width: 100%; padding: 18px; border: 3px solid #00a9e0; border-radius: 20px; background: #031d2b; color: white; font-size: 22px; outline: none; }
    button { width: 100%; padding: 20px; margin-top: 18px; border: none; border-radius: 20px; color: white; font-size: 22px; font-weight: bold; cursor: pointer; }
    .btn-scan { background: #00c875; }
    .btn-camera { background: #08a9df; }
    .btn-stop { background: #e53935; }
    #reader { display: none; width: 100%; margin-top: 20px; padding: 8px; border-radius: 15px; background: white; overflow: hidden; }
    .status { margin-top: 20px; padding: 18px; border-radius: 15px; border: 2px solid #00d084; background: #075d3e; color: white; font-size: 19px; line-height: 1.5; white-space: pre-line; }
    .status.error { background: #641d27; border-color: #ff6675; }
    .status.warning { background: #614b08; border-color: #ffd43b; }
    .status.info { background: #0c4a60; border-color: #00a9e0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>SCAN WAREHOUSE</h1>

    <div class="box">
      <!-- FORM DIRECT SUBMIT KE IFRAME TERSEMBUNYI -->
      <form id="scanForm" action="https://script.google.com/macros/s/AKfycby2S2oO_tmWABXU_7OkMFQub1YGtDoFDWgVJJ9IODFd2Nd-BWDSu76ttxkedCG9a9il1w/exec" method="GET" target="target_iframe" onsubmit="return kirimData()">
        
        <label for="jenis">Jenis Barang</label>
        <select id="jenis" name="jenis">
          <option value="MATERIAL">MATERIAL</option>
          <option value="ALAT">ALAT</option>
          <option value="FILM">FILM</option>
          <option value="MOTIF">MOTIF</option>
        </select>

        <label for="admin">Nama Admin</label>
        <input type="text" id="admin" name="admin" value="Adm">

        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah" value="1" min="1">

        <label for="barcode">Barcode</label>
        <input type="text" id="barcode" name="barcode" placeholder="Scan atau ketik barcode" autocomplete="off" required>

        <button type="submit" id="btnKirim" class="btn-scan">SCAN BARCODE</button>
      </form>

      <button type="button" class="btn-camera" onclick="bukaScanner()">FOKUS SCANNER</button>
      <button type="button" id="btnStop" class="btn-stop" onclick="tutupScanner()" style="display: none;">TUTUP SCANNER</button>

      <div id="reader"></div>
      <div id="status" class="status">Siap melakukan scan barcode.</div>
    </div>
  </div>

  <!-- IFRAME RACHASIA AGAR TIDAK PINDAH TAB -->
  <iframe name="target_iframe" id="target_iframe" style="display:none;" onload="responSelesai()"></iframe>

  <script>
    let scanner = null;
    let sedangScan = false;
    let prosesKirim = false;

    function tampilkanStatus(pesan, tipe = "") {
      const status = document.getElementById("status");
      status.textContent = pesan;
      status.className = "status";
      if (tipe) status.classList.add(tipe);
    }

    function kirimData() {
      const barcodeInput = document.getElementById("barcode").value.trim();
      if (!barcodeInput) {
        tampilkanStatus("Kode barcode belum diisi!", "warning");
        return false;
      }
      prosesKirim = true;
      tampilkanStatus("Mengirim data barcode: " + barcodeInput + "...", "info");
      return true;
    }

    function responSelesai() {
      if (prosesKirim) {
        const kode = document.getElementById("barcode").value;
        tampilkanStatus("SCAN BERHASIL DIKIRIM!\nKode: " + kode + "\nStok di Google Sheets otomatis terpotong.", "");
        document.getElementById("barcode").value = "";
        document.getElementById("barcode").focus();
        prosesKirim = false;
      }
    }

    function bukaScanner() {
      const reader = document.getElementById("reader");
      const btnStop = document.getElementById("btnStop");
      if (sedangScan) return;

      reader.style.display = "block";
      btnStop.style.display = "block";
      scanner = new Html5Qrcode("reader");
      sedangScan = true;

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        function (hasilBarcode) {
          document.getElementById("barcode").value = hasilBarcode;
          tutupScanner();
          document.getElementById("scanForm").submit();
          kirimData();
        },
        function () {}
      ).catch(function (err) {
        sedangScan = false;
        reader.style.display = "none";
        btnStop.style.display = "none";
        tampilkanStatus("Kamera error: " + err, "error");
      });
    }

    function tutupScanner() {
      if (scanner && sedangScan) {
        scanner.stop().then(() => scanner.clear()).catch(() => {});
      }
      scanner = null;
      sedangScan = false;
      document.getElementById("reader").style.display = "none";
      document.getElementById("btnStop").style.display = "none";
    }
  </script>
</body>
</html>
